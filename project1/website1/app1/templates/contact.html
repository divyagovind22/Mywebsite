{% extends 'master.html' %}
{% load static %}
{%block title %}Contact Page{% endblock %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-sm-4 offset-sm-4">
            <div class="bg-secondary text-white p-3 mt-5">
                <h1>CONTACT</h1>
                <form action="/contact" method="post">
                    {% csrf_token %}
                    <div class="mb-3 mt-3">
                        <label for="name" class="form-label">Name:</label>
                        <input type="text" class="form-control" id="name" 
                        placeholder="Enter your name" name="contact_name">
                    </div>
                    <div class="mb-3 mt-3">
                        <label for="email" class="form-label">Email:</label>
                        <input type="email" class="form-control" id="email"
                        placeholder="Enter your email" name="contact_email">
                    </div>
                    <div class="mb-3 mt-3">
                        <label for="msg">Message:</label>
                        <textarea class="form-control" rows="5" id="msg" name="contact_msg"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Sumbit</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
